services:
  - type: web
    name: pam-ai
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm rebuild better-sqlite3 && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_BASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: PAMAI_SESSION_TOKEN_SECRET
        sync: false
      - key: PAMAI_MOCK_PEGA_CALLBACKS
        value: "false"
      - key: PEGA_CLIENT_ID
        sync: false
      - key: PEGA_CLIENT_SECRET
        sync: false
      - key: PEGA_TOKEN_ENDPOINT
        value: https://bluevoir-251.pegademo.com/prweb/PRRestService/oauth2/v1/token
      - key: PEGA_EXPENSE_DATA_VIEW_URL
        value: https://bluevoir-251.pegademo.com/prweb/api/application/v2/data_views/D_ExpenseProcessing
      - key: PAMAI_DEFAULT_CASE_ID
        value: E-7036
      - key: PAMAI_DEFAULT_CUSTOMER_MOBILE
        value: "+910000003210"
      - key: PAMAI_PEGA_CALLBACK_URL
        value: https://bluevoir-251.pegademo.com/prweb/api/VoiceAICaseCreation/V1/ResumeFlowfromVoiceAI
      - key: OPENAI_REASONING_MODELS
        value: gpt-5.4-mini,gpt-4o-mini
      - key: OPENAI_TRANSCRIPTION_MODEL
        value: gpt-4o-transcribe
      - key: OPENAI_TRANSCRIPTION_LANGUAGE
        value: en
      - key: OPENAI_TTS_MODEL
        value: gpt-4o-mini-tts
      - key: OPENAI_TTS_VOICE
        value: nova
      - key: OPENAI_TTS_INSTRUCTIONS
        value: Speak as a warm young adult female support assistant. Keep the delivery natural, bright, and concise. Say Pam AI as Pam A.I., not as one fused word.
